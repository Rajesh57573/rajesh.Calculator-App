<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator App</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=history,more_vert,light_mode,dark_mode" />
  </head>
  <body class="light">
    <nav>
        <h1>Calculator</h1>
        <span class="material-symbols-outlined">light_mode</span>
    </nav>
    <div class="container">
        <div class="cal-nav">
            <span class="material-symbols-outlined">history</span>
            <span class="material-symbols-outlined">more_vert</span>
        </div>
        <div class="input-row">
            <input type="text" placeholder="0">
        </div>
        <div class="button">
            <div class="rows row-1">
                <button id="ac-btn" class="btn">AC</button>
                <button class="operation-btn btn">DEL</button>
                <button class="operation-btn btn">%</button>
                <button class="operation-btn btn">/</button>
            </div>
            <div class="rows row-2">
                <button class="num-btn btn">7</button>
                <button class="num-btn btn">8</button>
                <button class="num-btn btn">9</button>
                <button class="operation-btn btn">*</button>
            </div>
            <div class="rows row-3">
                <button class="num-btn btn">4</button>
                <button class="num-btn btn">5</button>
                <button class="num-btn btn">6</button>
                <button class="operation-btn btn">-</button>
            </div>
            <div class="rows row-4">
                <button class="num-btn btn">1</button>
                <button class="num-btn btn">2</button>
                <button class="num-btn btn">3</button>
                <button class="operation-btn btn">+</button>
            </div>
            <div class="rows row-5">
                <button class="num-btn btn">00</button>
                <button class="num-btn btn">0</button>
                <button class="num-btn btn">.</button>
                <button id="equal-btn" class="btn">=</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
